<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d">
  <title id="t">Matrix PoC – komunikator firmowy</title>
  <desc id="d">Baner projektu: zamknięty komunikator firmowy oparty na Synapse, LLDAP, Coturn, Nginx i Tailscale.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03100a"/>
      <stop offset="1" stop-color="#0d2f20"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e676" stop-opacity="0"/>
      <stop offset="1" stop-color="#00e676" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>

  <!-- sieć węzłów po prawej -->
  <g stroke="url(#line)" stroke-width="1.5" fill="none">
    <path d="M780 170 L880 80 L1000 150 L930 220 L780 170"/>
    <path d="M880 80 L1090 70 L1000 150"/>
    <path d="M1000 150 L1130 210 L930 220"/>
    <path d="M1090 70 L1130 210"/>
    <path d="M880 80 L930 220"/>
  </g>
  <g fill="#00e676" filter="url(#glow)">
    <circle cx="880" cy="80" r="7"/>
    <circle cx="1000" cy="150" r="10"/>
    <circle cx="930" cy="220" r="6"/>
    <circle cx="1090" cy="70" r="6"/>
    <circle cx="1130" cy="210" r="8"/>
    <circle cx="780" cy="170" r="5"/>
  </g>

  <!-- logo [m] -->
  <text x="48" y="178" font-family="Consolas, 'Courier New', monospace" font-size="130" font-weight="700" fill="#00e676" filter="url(#glow)">[m]</text>

  <!-- tytuł -->
  <text x="330" y="132" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#e8fff1">Matrix PoC</text>
  <text x="332" y="176" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" fill="#7dffb3">Zamknięty komunikator firmowy</text>
  <text x="332" y="216" font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#9bd6b3">Synapse · LLDAP · Coturn · Nginx · Tailscale</text>
</svg>
