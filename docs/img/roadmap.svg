  <rect x="945" y="270" width="190" height="150" rx="12" fill="#1b4a35" stroke="#00e676" stroke-width="2"/>
  <circle cx="979" cy="302" r="18" fill="#00e676"/><text x="979" y="308" text-anchor="middle" font-size="16" font-weight="800" fill="#04100a">10</text>
  <text x="961" y="348" font-size="17" font-weight="700" fill="#e8fff1">Testy</text>
