<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Mapa kroków instalacji</title>
  <desc id="d">Dziesięć kroków: połączenie z VM, Docker, Tailscale, pliki projektu, sekrety, certyfikaty, uruchomienie usług, konta LLDAP, klienci i testy.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dffb3"/>
    </marker>
  </defs>

  <rect width="1200" height="460" rx="18" fill="#0b1410"/>
