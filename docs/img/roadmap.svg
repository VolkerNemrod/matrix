  <circle cx="539" cy="112" r="18" fill="#00c853"/><text x="539" y="118" text-anchor="middle" font-size="17" font-weight="800" fill="#04100a">3</text>
  <text x="521" y="158" font-size="17" font-weight="700" fill="#e8fff1">Tailscale</text>
