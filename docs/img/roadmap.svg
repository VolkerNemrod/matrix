  <!-- 9 -->
  <rect x="725" y="270" width="190" height="150" rx="12" fill="#10231a" stroke="#2e5d45" stroke-width="1.5"/>
  <circle cx="759" cy="302" r="18" fill="#00c853"/><text x="759" y="308" text-anchor="middle" font-size="17" font-weight="800" fill="#04100a">9</text>
  <text x="741" y="348" font-size="17" font-weight="700" fill="#e8fff1">Klienci</text>
