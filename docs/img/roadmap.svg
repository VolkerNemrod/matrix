  <text x="301" y="158" font-size="17" font-weight="700" fill="#e8fff1">Docker i Compose</text>
  <text x="301" y="180" font-size="13" fill="#9bd6b3">sprawdzenie wersji</text>
  <rect x="301" y="192" width="50" height="26" rx="13" fill="#1d5a38"/><text x="326" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#c9ffd9">VM</text>

  <!-- 3 -->
