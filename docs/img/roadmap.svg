  <!-- 7 -->
  <rect x="285" y="270" width="190" height="150" rx="12" fill="#10231a" stroke="#2e5d45" stroke-width="1.5"/>
  <circle cx="319" cy="302" r="18" fill="#00c853"/><text x="319" y="308" text-anchor="middle" font-size="17" font-weight="800" fill="#04100a">7</text>
