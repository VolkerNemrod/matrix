  <!-- ===== wiersz 1 ===== -->
  <!-- 1 -->
  <rect x="65" y="80" width="190" height="150" rx="12" fill="#10231a" stroke="#2e5d45" stroke-width="1.5"/>
  <circle cx="99" cy="112" r="18" fill="#00c853"/><text x="99" y="118" text-anchor="middle" font-size="17" font-weight="800" fill="#04100a">1</text>
  <text x="81" y="158" font-size="17" font-weight="700" fill="#e8fff1">Połącz się z VM</text>
  <text x="81" y="180" font-size="13" fill="#9bd6b3">połączenie przez ssh</text>
  <rect x="81" y="192" width="50" height="26" rx="13" fill="#1f4f7a"/><text x="106" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#cfe8ff">PC</text>

  <!-- 2 -->
  <rect x="285" y="80" width="190" height="150" rx="12" fill="#10231a" stroke="#2e5d45" stroke-width="1.5"/>
