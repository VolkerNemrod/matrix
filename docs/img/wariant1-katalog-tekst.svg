<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t1 d1">
  <title id="t1">Wariant 1 – wbudowany katalog Synapse (tekst, bez drzewa)</title>
  <desc id="d1">Pracownik wyszukuje frazę np. "Księgowość" w katalogu użytkowników Synapse. Wyniki to płaska lista osób z działem i lokalizacją wpisanymi w nazwę wyświetlaną – bez grupowania wizualnego ani drzewa organizacyjnego.</desc>
  <rect width="1200" height="460" rx="18" fill="#0b1410"/>
  <text x="600" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#e8fff1">Wariant 1 · Wbudowany katalog Synapse</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#9bd6b3">wyszukiwanie tekstowe, bez drzewa — WYBRANY kierunek, częściowo sprawdzony</text>

  <rect x="340" y="104" width="520" height="54" rx="27" fill="#16382a" stroke="#3fa56b" stroke-width="1.5"/>
  <circle cx="372" cy="131" r="9" fill="none" stroke="#7dffb3" stroke-width="2.5"/>
  <line x1="379" y1="138" x2="389" y2="148" stroke="#7dffb3" stroke-width="2.5" stroke-linecap="round"/>
  <text x="400" y="137" font-size="16" fill="#e8fff1">Księgowość</text>

  <g font-size="15">
    <rect x="300" y="186" width="600" height="52" rx="10" fill="#1b4a35" stroke="#00e676" stroke-width="1.5"/>
    <text x="320" y="218" fill="#e8fff1">Jan Kowalski – <tspan fill="#7dffb3" font-weight="700">Księgowość</tspan>, Warszawa</text>

    <rect x="300" y="248" width="600" height="52" rx="10" fill="#16382a" stroke="#3fa56b"/>
    <text x="320" y="280" fill="#e8fff1">Ewa Zielińska – <tspan fill="#7dffb3" font-weight="700">Księgowość</tspan>, Poznań</text>

    <rect x="300" y="310" width="600" height="52" rx="10" fill="#16382a" stroke="#3fa56b"/>
    <text x="320" y="342" fill="#e8fff1">Marek Wójcik – <tspan fill="#7dffb3" font-weight="700">Księgowość</tspan>, Kraków</text>
  </g>

  <g transform="translate(960,186)">
    <rect x="0" y="0" width="200" height="176" rx="12" fill="#2a1a12" stroke="#ffcc66" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="100" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#ffcc66">Czego brak</text>
    <g stroke="#e8d9b0" stroke-width="2" fill="none">
      <line x1="100" y1="46" x2="100" y2="66"/>
      <line x1="100" y1="66" x2="60" y2="90"/>
      <line x1="100" y1="66" x2="100" y2="90"/>
      <line x1="100" y1="66" x2="140" y2="90"/>
