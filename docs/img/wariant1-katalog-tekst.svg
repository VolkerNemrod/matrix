    <circle cx="100" cy="90" r="6" fill="#e8d9b0"/>
    <circle cx="140" cy="90" r="6" fill="#e8d9b0"/>
    <line x1="40" y1="30" x2="160" y2="106" stroke="#ff6666" stroke-width="3"/>
    <text x="100" y="128" text-anchor="middle" font-size="12" fill="#e8d9b0">drzewo organizacyjne</text>
