<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t2 d2">
  <title id="t2">Wariant 2 – widget + Widget API navigate</title>
  <desc id="d2">Widget w pokoju wysyła akcję navigate z identyfikatorem matrix.to; Element przechwytuje ją lokalnie i otwiera rozmowę 1:1 bez wychodzenia do przeglądarki. Cały wariant jest niesprawdzony w praktyce.</desc>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dffb3"/>
    </marker>
    <marker id="arrB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6cb6ff"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="18" fill="#0b1410"/>
  <text x="600" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#e8fff1">Wariant 2 · Widget + Widget API „navigate”</text>
  <g>
    <rect x="1020" y="18" width="150" height="30" rx="15" fill="#3a2a10" stroke="#ffcc66"/>
    <text x="1095" y="38" text-anchor="middle" font-size="12" font-weight="700" fill="#ffcc66">NIESPRAWDZONE</text>
  </g>

  <rect x="50" y="140" width="220" height="110" rx="12" fill="#16382a" stroke="#3fa56b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="160" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#e8fff1">Widget</text>
  <text x="160" y="202" text-anchor="middle" font-size="12" fill="#9bd6b3">lista osób w pokoju</text>
  <text x="160" y="220" text-anchor="middle" font-size="12" fill="#9bd6b3">(dynamicznie z user_directory)</text>

  <path d="M270 195 L360 195" stroke="#7dffb3" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="315" y="178" text-anchor="middle" font-size="11" fill="#7dffb3">fromWidget:</text>
  <text x="315" y="192" text-anchor="middle" font-size="11" fill="#7dffb3">navigate</text>

  <rect x="360" y="140" width="220" height="110" rx="12" fill="#1b4a35" stroke="#00e676" stroke-width="2"/>
  <text x="470" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#e8fff1">Widget API</text>
  <text x="470" y="202" text-anchor="middle" font-size="12" fill="#9bd6b3">uri: matrix.to/#/@user:</text>
  <text x="470" y="220" text-anchor="middle" font-size="12" fill="#9bd6b3">matrix.local</text>

  <path d="M580 195 L670 195" stroke="#7dffb3" stroke-width="2" marker-end="url(#arr2)"/>

  <rect x="670" y="140" width="220" height="110" rx="12" fill="#16382a" stroke="#3fa56b" stroke-width="1.5"/>
  <text x="780" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#e8fff1">Element</text>
  <text x="780" y="196" text-anchor="middle" font-size="12" fill="#9bd6b3">przechwytuje URI</text>
  <text x="780" y="214" text-anchor="middle" font-size="12" fill="#9bd6b3">lokalnie, bez przeglądarki</text>
  <text x="780" y="232" text-anchor="middle" font-size="11" fill="#7fa893">(czy wspiera — do sprawdzenia)</text>

  <path d="M890 195 L980 195" stroke="#6cb6ff" stroke-width="2" marker-end="url(#arrB2)"/>

  <rect x="980" y="140" width="170" height="110" rx="12" fill="#16382a" stroke="#6cb6ff" stroke-width="1.5"/>
  <text x="1065" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#e8fff1">DM 1:1</text>
  <text x="1065" y="202" text-anchor="middle" font-size="12" fill="#9fd0ff">otwarte w aplikacji</text>
  <text x="1065" y="220" text-anchor="middle" font-size="12" fill="#9fd0ff">(w teorii)</text>

  <g transform="translate(50,300)">
    <text x="0" y="0" font-size="13" fill="#ffaaaa">Dla porównania – obecny widget (wstrzymany): klik → link matrix.to → przeglądarka → wymaga internetu</text>
    <line x1="0" y1="10" x2="560" y2="10" stroke="#ff6666" stroke-width="2"/>
  </g>

  <text x="600" y="380" text-anchor="middle" font-size="13" fill="#7fa893">Nie rozwiązuje: ręcznej listy osób (bez dynamicznego API) ani zgody przy dodaniu widgetu per pokój</text>
</svg>
